services:
  db:
    image: postgres:15-alpine
    container_name: pg_payment_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DOCKER_PASSWORD}
      POSTGRES_DB: payment_gateway_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: payment_backend
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      - DATABASE_URL=postgresql://postgres:${DOCKER_PASSWORD}@db:5432/payment_gateway_db
    env_file:
      - ./server/.env
    depends_on:
      - db

volumes:
  pgdata: