name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: |
          server/package-lock.json
          client/package-lock.json

    - name: Install Server Dependencies
      run: |
        cd server
        npm ci

    - name: Typecheck and Build Server
      run: |
        cd server
        npm run build --if-present

    # - name: Run Server Tests
    #   run: |
    #     cd server
    #     npm test --if-present

    - name: Install Client Dependencies
      run: |
        cd client
        npm ci

    - name: Typecheck and Build Client
      run: |
        cd client
        npm run build --if-present

    # - name: Run Client Tests
    #   run: |
    #     cd client
    #     npm test --if-present